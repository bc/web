<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }} | {{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="/favicon-32x32.png">

  <link rel="stylesheet" href="https://fonts.xz.style/serve/inter.css">
  <link rel="stylesheet" href="https://fonts.xz.style/serve/playfair-display.css">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">

  {% seo %}
</head>
<body>
  <header>
    <nav class="container">
      <a href="/" class="site-title">{{ site.title }}</a>

      <div style="margin-left: auto;"></div>

      <a href="/" {% if page.url == '/' %}class="active"{% endif %}>Home</a>
      <a href="#" data-cal-link="bcohn/meet-brian">Schedule</a>
      <a href="https://raw.githubusercontent.com/bc/resume/main/briancohn.pdf" target="_blank">CV</a>
      <a href="https://scholar.google.com/citations?user=0obwS54AAAAJ&hl=en&oi=sra" target="_blank">Papers</a>
      <a href="https://www.linkedin.com/in/cohn/" target="_blank">LinkedIn</a>
      <a href="https://github.com/bc" target="_blank">GitHub</a>
      <a href="/presskit/" {% if page.url == '/presskit/' %}class="active"{% endif %}>Press Kit</a>
      <a href="/research/" {% if page.url == '/research/' %}class="active"{% endif %}>Research</a>
      <a href="/ml-tools/" {% if page.url == '/ml-tools/' %}class="active"{% endif %}>ML Tools</a>
    </nav>
  </header>

  <main class="container">
    {{ content }}
  </main>

  <footer>
    <div class="container">
      <p><strong>Brian Cohn Ph.D.</strong></p>
      <p>Chief Scientist at Kaspect | Director of Research at ObvioHealth</p>
      <p>
        <a href="mailto:briancohn@kaspect.com">briancohn@kaspect.com</a>
      </p>
    </div>
  </footer>

  {% include cal-embed.html %}
</body>
</html>
