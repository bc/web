# Site metadata
title: Brian Cohn Ph.D.
tagline: Biologist. Product Developer. ML Researcher.
description: >
  Leveraging statistical modeling, machine learning, and closed-loop DSP hardware
  to solve healthcare and biotechnology challenges.

url: https://bc.com
baseurl: ""
email: briancohn@kaspect.com

# Theme
theme: minima

# Plugins
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap
  - jekyll-paginate

# Collections
collections:
  pages:
    output: true
    permalink: /:name/
  research:
    output: true
    permalink: /research/:name

# Markdown
markdown: kramdown
kramdown:
  auto_ids: true
  toc_levels: 2..3

# Build settings
permalink: /:year/:month/:day/:title/
timezone: America/Los_Angeles

exclude:
  - .github/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - package*.json
  - scripts/
  - vendor/
  - tests/
  - "*.log"
  - README.md

include:
  - .htaccess
  - .well-known
  - _pages

# Assets
sass:
  sass_dir: _sass
  style: compressed

# Pagination
paginate: 10
paginate_path: "/posts/page:num/"

# Defaults
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      author: "Brian Cohn"
  - scope:
      path: "_pages"
      type: "pages"
    values:
      layout: "page"

# SEO & Social
author:
  name: Brian Cohn
  email: briancohn@kaspect.com
  uri: https://bc.com

social:
  name: Brian Cohn
  links:
    - https://github.com/bc
    - https://www.linkedin.com/in/cohn/
    - https://scholar.google.com/citations?user=0obwS54AAAAJ&hl=en&oi=sra

# Performance
liquid:
  error_mode: warn
  strict_filters: false
  strict_variables: false

# Color scheme
colors:
  primary: "#FF9398"
  accent: "#49c5b6"
  dark: "#000000"
  light: "#ffffff"
