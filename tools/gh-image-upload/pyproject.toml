[project]
name = "gh-image-upload"
version = "0.1.0"
description = "Upload images to GitHub issues and comments via the undocumented user-attachments API"
readme = {text = "Upload images to GitHub issues via the undocumented user-attachments API", content-type = "text/plain"}
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "rich>=13.0",
]

[project.scripts]
gh-image-upload = "gh_image_upload:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
